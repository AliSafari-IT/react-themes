name: Publish

on:
  push:
    # Run on all branches except gh-pages and on version tags
    branches:
      - '**'
      - '!gh-pages'
    tags:
      - 'v*'

# contents: write is needed for gh-pages deployment (jobs can override if needed)
permissions:
  contents: write

jobs:
  publish-canary:
    name: Publish canary on every push
    # only branches, and avoid gh-pages explicitly as a safeguard
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: canary-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Set unique canary version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          # e.g. 1.2.3-canary.abc123.1234
          pnpm version "${BASE}-canary.${SHA}.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          node -p "require('./package.json').version"

      - name: Publish canary to NPM
        run: pnpm publish --no-git-checks --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release:
    name: Publish stable on tag
    if: startsWith(github.ref, 'refs/tags/v') # only v* tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Publish to NPM (latest)
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy_pages:
    name: Deploy docs to GitHub Pages
    needs:
      - publish-canary
      - publish-release
    if: always() && (needs.publish-canary.result == 'success' || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    # inherits top-level contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build # or your site build command
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: demo/dist # change to your built site dir